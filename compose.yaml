# The whole local world, one command:  docker compose up -d --wait
# Four stores, each here by a recorded decision (SAD §9), and — since the webhook
# dispatcher chapter — the three services themselves. Host ports are env knobs with the
# standard defaults; the container side never changes.
#
# The services are in a PROFILE. `docker compose up -d --wait` still brings up
# only the stores, which is what every chapter from 1.2 onwards tells a reader to
# run and what the test lanes expect: the suites start their own api and their
# own gateways, and a second copy holding the same tables would race them
# (the outbox chapter's finding 4). `--profile services` runs the platform instead.
name: relay

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Dev-only credentials — this file never ships anywhere.
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "${RELAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "relay", "-d", "relay"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    # No volume, on purpose: nothing in Redis is a source of truth.
    # Fan-out is lossy by design (ADR-07); presence self-heals (ADR-10).
    ports:
      - "${RELAY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.12-alpine
    # JetStream on (-js) with file storage (-sd): the durable event spine
    # (ADR-02) must survive a restart. -m exposes the monitoring endpoint.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${RELAY_NATS_PORT:-4222}:4222"
      - "${RELAY_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    # The analytical store rides its own path (CON-01): single node in v1,
    # schema already cluster-shaped (ADR-08).
    ports:
      - "${RELAY_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${RELAY_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      # A NEW USER. This does not lift `default`'s restriction and is not meant to:
      # the image ships `users.d/default-user.xml` limiting `default` to ::1 and
      # 127.0.0.1, that file belongs to the image, and anyone "fixing" it is editing
      # somebody else's file. `relay` answers from the host; `default` still does not.
      CLICKHOUSE_USER: relay
      CLICKHOUSE_PASSWORD: relay
      # CREATES THE DATABASE. It does NOT make it the session's: `SELECT
      # currentDatabase()` over HTTP as `relay` still answers `default`, so an
      # unqualified CREATE TABLE builds the schema in `default` while this one sits
      # empty. Every statement in `analytics/` names `relay_analytics` for that reason.
      CLICKHOUSE_DB: relay_analytics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      # RUNS A QUERY, because the old check ran `/ping` — which neither authenticates
      # nor is network-restricted. It was green from chapter 1.2 to this one while every
      # query from outside the container was refused. A check that cannot fail for the
      # reason you care about is not a check.
      #
      # `clickhouse-client` is in the image; `curl` is not.
      test: ["CMD", "clickhouse-client", "--user", "relay", "--password", "relay",
             "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  minio:
    # OBJECT STORAGE, WHICH ADR-13 DECIDED AND NOTHING PROVISIONED. Media bytes never
    # transit Relay compute: the api signs a URL and the client uploads straight here.
    # `docs/05-sad.md:1002` has named MinIO since the first draft and the container was
    # never added, so this is the decision arriving nine chapters after the diagram.
    #
    # THE REGISTRY IS PART OF THE NAME, AND THE NAME THAT WORKED STOPPED WORKING.
    # `docker run minio/minio` fails on Docker Hub with `pull access denied … repository
    # does not exist or may require 'docker login'`, and the SAD's sentence predates
    # that. Four images were tried here and `quay.io/minio/minio` was the one that
    # pulled — **and on 2026-09-26 it answered `401 unauthorized` too**, six days after
    # pulling cleanly in CI. Re-measured then:
    #
    #     docker pull quay.io/minio/minio:latest               401 Unauthorized
    #     docker pull quay.io/minio/minio:RELEASE.2025-04-22…   401 UNAUTHORIZED
    #     docker pull minio/minio:latest                        pull access denied
    #     docker manifest inspect chainguard/minio:latest       OK
    #
    # **NO LOCAL RUN COULD SEE IT.** The image had been in every developer's cache since
    # the chapter that added it, so the first machine without one was CI — where both
    # platform jobs died at this line, before `pnpm build`. That is the persisting-volume
    # shape one layer out: a local cache hides the state a fresh machine meets.
    #
    # `chainguard/minio` IS THE SAME BINARY, and that is checked rather than assumed:
    # `RELEASE.2026-09-22T19-25-18Z`, `ENTRYPOINT ["/usr/bin/minio"]` so `server /data`
    # below is unchanged, the same `MINIO_ROOT_*` variables, and `mc` in the image — the
    # health check at the foot of this block runs verbatim.
    #
    # WHAT IT COSTS IS A UID. This image runs as **65532** where the old one ran as root,
    # so an existing volume — root-owned, mode 755 — stops it dead with `FATAL Unable to
    # initialize backend: file access denied`. **A fresh machine and CI never meet it.**
    # Anyone holding a volume from before this change runs one command, which preserves
    # every object rather than discarding them:
    #
    #     docker run --rm -v relay_minio-data:/d alpine chown -R 65532:65532 /d
    #
    # The non-root default is kept rather than undone with `user: "0:0"`, because giving
    # back a security property to save a one-time `chown` on developer machines is a
    # permanent cost for a single inconvenience.
    image: chainguard/minio:latest
    command: server /data
    ports:
      # 9100, NOT MINIO'S CONVENTIONAL 9000, AND THE COLLISION WAS REAL. ClickHouse has
      # published `${RELAY_CLICKHOUSE_NATIVE_PORT:-9000}:9000` since chapter 1.2, so the
      # two services cannot both start: the loser dies with `Bind for 127.0.0.1:9000
      # failed: port is already allocated` and `docker compose up -d` exits 1.
      #
      # The container port stays 9000 — that is MinIO's, and the health check below is
      # inside the container. Only the host side moves, because the host side is the
      # hand-maintained table and chapter 1.2's is the one that was there first.
      - "${RELAY_MINIO_PORT:-9100}:9000"
    environment:
      MINIO_ROOT_USER: relay
      MINIO_ROOT_PASSWORD: relay-secret
    volumes:
      - minio-data:/data
    healthcheck:
      # AUTHENTICATES, for the reason the ClickHouse check above gives. `/minio/health/live`
      # answers 200 to anyone who can reach the port and says nothing about whether a
      # credentialed call works — the same shape as the `/ping` that was green for sixteen
      # chapters while every real query was refused.
      #
      # `mc` is in the image and `wget` and `nc` are not, so this is the available way to
      # ask a question only a working store can answer.
      test: ["CMD", "sh", "-c",
             "mc alias set probe http://127.0.0.1:9000 relay relay-secret && mc ls probe"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.28
    # An SMTP server that accepts everything and delivers nothing,
    # with an HTTP API for reading what it caught.
    #
    # WHY A CONTAINER RATHER THAN A FAKE. FR-WHK-07 says an email must not contain a
    # signing secret, and the only artefact that can settle that is the message a
    # server RECEIVED — a stub records what the sender passed, which is the same
    # object the assertion would be reading, so a mailer that dropped the secret
    # into a header the stub does not model would pass. Constitution VII asks a
    # fifth container to justify itself; this is the justification (research R9).
    #
    # No volume. Mailpit holds messages in memory, and a test inbox that survived
    # a restart would be a test inbox that leaks state between runs — the same
    # reasoning as Redis's, which the entry above records.
    ports:
      - "${RELAY_MAILPIT_HTTP_PORT:-8025}:8025"
      - "${RELAY_MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      # Without one, `docker compose up -d --wait` waits for RUNNING rather than
      # for READY, and V9 can read the API before it is serving. `infra.test.ts`
      # says the same thing about the other four.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5


  clamav:
    image: clamav/clamav:1.5
    # The seventh container, and the only one that reads a customer's bytes
    # (chapter 4.13). Constitution VII asks a new container to justify itself and
    # FR-MED-04 is the justification: *"every uploaded object shall be
    # virus-scanned"*, which is not a thing this workspace can write in TypeScript.
    #
    # NOT PROFILED, WHICH IS THE OPPOSITE ANSWER FROM THE WORKER'S. The worker
    # WRITES — an unprofiled one would sweep every `pending` object in the lane
    # during every suite, rewriting fixtures other tests planted. This container
    # mutates nothing, and the worker's own suites need it up when a bare
    # `docker compose up -d --wait` is all that ran.
    #
    # A REAL SCANNER RATHER THAN A FAKE, for mailpit's reason one clause over: a
    # stub records what the sender passed, and the question FR-MED-04 asks is what
    # a scanner DID with the bytes. The measurements this chapter publishes — that
    # EICAR plus two hundred spaces is `OK`, that the signature matches the file
    # and not a substring — are unavailable from anything we could write.
    ports:
      - "${RELAY_CLAMAV_PORT:-3310}:3310"
    healthcheck:
      # THE DATE, NOT A PING, AND THE WINDOW IS MEASURED.
      #
      # `zPING` answers `PONG` from a scanner whose signature database is thirteen
      # days old, because `freshclam` downloads 355,678 signatures AFTER clamd
      # starts answering. Measured on this image: `28122/Sun Sep 13` at twelve,
      # sixteen, twenty and twenty-five seconds, `28135/Sat Sep 26` at thirty. A
      # liveness probe passes at twelve, `--wait` returns, and the worker starts
      # scanning against definitions from a fortnight ago.
      #
      # That is chapter 4.2's `/ping`, 4.9's unset credential and 4.10's bucket for
      # the fourth time — *a check that cannot fail for the reason you care about
      # is not a check* — and this one has a measured window rather than a
      # hypothesis. `clamdscan -V` asks the DAEMON, so it reports the database the
      # daemon has loaded rather than what is on disk.
      #
      # SEVEN DAYS. ClamAV publishes daily; a bound of one would go red on any
      # machine that starts the stack before freshclam's first run of the day, and
      # a bound of thirty would pass the window this check exists to catch.
      test:
        - CMD-SHELL
        - >-
          V=$$(clamdscan -V) &&
          D=$$(echo "$$V" | cut -d/ -f3) &&
          B=$$(date -D "%a %b %d %H:%M:%S %Y" -d "$$D" +%s) &&
          [ $$(( ($$(date +%s) - $$B) / 86400 )) -le 7 ]
      interval: 5s
      timeout: 10s
      # LONGER THAN THE OTHERS, because this is not "is it up" — it is "has
      # freshclam finished", and the answer is a 355,678-signature download that is
      # bandwidth-bound and unbounded on a slow link.
      #
      # TWENTY RETRIES WAS 130 s OF GRACE AND CI NEEDED 136 (feature 068). The
      # budget did not shrink — **the gap the download has to close grew**. This
      # image is pinned at `clamav/clamav:1.5` and the database it ships ages one
      # day per day: on 2026-10-06 it booted at local 28136 against a remote 28145,
      # nine versions and more than the seven days this check allows. So a fresh
      # volume can no longer pass on the bundled database at all — it must download
      # first, and `clamdscan -V` asks the DAEMON, so the daemon must then reload.
      # Measured in CI: `compose up` at 11:38:52, `unhealthy` at 11:41:08, and
      # `daily.cld updated (version: 28145, sigs: 355726)` in the last log line
      # before the failure. It finished the download as the budget ran out.
      #
      # INVISIBLE ON ANY DEVELOPER MACHINE, for 056-9's reason exactly: the volume
      # persists, so this host answered `28143/Sun Oct 4` and `healthy` in
      # milliseconds while CI could not pass at all. The only instrument that sees
      # it is an empty volume.
      #
      # Forty retries is 230 s. That is not a measurement of the download, which is
      # bandwidth-bound and will differ on every runner; it is headroom over the one
      # observation there is. **The real fix is a fresher image**, and the day this
      # number has to move again is the day to take it.
      retries: 40
      start_period: 30s


  # --- the services (the webhook dispatcher chapter) -----------------------
  # Behind `--profile services`, for the reason above.

  api:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      RELAY_NATS_URL: nats://nats:4222
      # ONE REPLICA, BECAUSE THIS BROKER IS ONE NODE. The Dockerfile sets
      # `NODE_ENV=production`, so `replicaCount()` returns ADR-02's R3 and every
      # `streams.add` answers `replicas > 1 not supported in non-clustered mode`
      # — the composed api cannot create a stream it does not have (049-2). The
      # escape hatch has existed since chapter 4.4 and nothing set it: the
      # streams were created from OUTSIDE the container once, and survived on
      # the volume for nineteen features, which is why the defect stayed hidden
      # until feature 068 recreated the volume.
      RELAY_NATS_REPLICAS: "1"
      # Container names, not localhost — the api's own default is
      # `redis://localhost:6379`, which inside this container is not the Redis
      # service. And the tenant limiter FAILS OPEN by design (SAD §6.3), so a
      # missing address would not crash anything: the composed stack would serve
      # every request unlimited while reporting a limit. The constitution
      # requires the full stack to start with one command, and this is what makes
      # that true rather than merely quiet (research R24).
      #
      # RELAY_SMTP_URL joins in the transport phase, with the container it names.
      RELAY_REDIS_URL: redis://redis:6379
      # Development values. Both are secrets in anything that is not a laptop,
      # and the api refuses to start in production without the first.
      RELAY_WEBHOOK_SECRET_KEY: ${RELAY_WEBHOOK_SECRET_KEY:-}
      RELAY_INTERNAL_CREDENTIAL: ${RELAY_INTERNAL_CREDENTIAL:-rk_svc_local_development_credential_0000}
      # The api verifies every service credential, so it holds all three. This comment
      # said "both" for two chapters and the media worker is the third (4.13) — the list
      # grows with the SERVICES, not with the routes.
      RELAY_INTERNAL_CREDENTIAL_GATEWAY: ${RELAY_INTERNAL_CREDENTIAL_GATEWAY:-rk_svc_local_development_gateway_00000}
      RELAY_INTERNAL_CREDENTIAL_WORKER: ${RELAY_INTERNAL_CREDENTIAL_WORKER:-rk_svc_local_development_worker_000000}
      # Chapter 4.7. THE FIRST OPERATIONAL SERVICE TO READ THE ANALYTICAL STORE, and that
      # is the subject rather than the plumbing: constitution III says billing, metering and
      # dashboard analytics read only from ClickHouse, and FR-ANL-06 requires comparing them
      # against Postgres. The reconciler is none of those three roles — it audits the
      # boundary, and an auditor confined to one side of a fence cannot check the fence.
      RELAY_CLICKHOUSE_HOST: clickhouse
      RELAY_CLICKHOUSE_HTTP_PORT: "8123"
      RELAY_CLICKHOUSE_USER: relay
      RELAY_CLICKHOUSE_PASSWORD: relay
      # TWO ADDRESSES FOR ONE STORE, AND THE OMISSION OF BOTH COST A PERMANENT 503.
      #
      # The block above says "container names, not localhost" and MinIO was the one
      # service it did not name, while `depends_on` below waits on it — a dependency
      # declared and an address forgotten. `store.ts` then fell back to
      # `http://localhost:9100`, which inside this container is this container, so
      # `storeReady` was refused and FR-017 answered `media_storage_unavailable` to
      # every slot request. Measured from a shell in here: `localhost:9100 ->
      # ECONNREFUSED`, `minio:9000 -> 200`, with the same store answering 200 on the
      # host. Nothing caught it because every media suite runs the api as a host
      # process, where the default is correct.
      #
      # THEY DIFFER BECAUSE THE HOST IS INSIDE THE SIGNATURE. `X-Amz-SignedHeaders:
      # host`, so a URL signed for one origin is refused at the other. The client is
      # outside this network and gets the published port; the api is inside it and
      # reaches the same store by service name. Splitting them is the only way both
      # requests are signed for where they are actually sent.
      RELAY_MINIO_ENDPOINT: http://localhost:9100
      RELAY_MINIO_INTERNAL_ENDPOINT: http://minio:9000
      PORT: "4000"
    ports:
      - "${RELAY_API_PORT:-4000}:4000"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      # AND THE OBJECT STORE, because the api reaches it on every slot request — unlike
      # `clickhouse`, which is absent from this list because the api never touches it at
      # boot. Without the condition the api can accept traffic before the store answers,
      # and the first slot request is refused with `media_storage_unavailable`: correct,
      # and indistinguishable from a real outage.
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  gateway:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      RELAY_API_URL: http://api:4000
      RELAY_REDIS_URL: redis://redis:6379
      # CONTAINER NAME, NOT localhost -- and this line is what makes chapter 4.5's
      # producer reach anything. `createConnectionPublisher` defaults to
      # `nats://localhost:4222`, which inside this container is the gateway's own
      # loopback rather than the broker; and a connection-log publish failure is
      # SWALLOWED by design (constitution III), so without this the records go nowhere
      # and nothing says so. The api's entry carries the same note about Redis for the
      # same reason: a missing address is harder to see than a wrong one, because there
      # is no sentence to disagree with.
      RELAY_NATS_URL: nats://nats:4222
      PORT: "4001"
      # The gateway's first credential of its own. Every other
      # call it makes forwards the END USER's token; a usage report is nobody's
      # user action, so it speaks for itself. Its own variable rather than the
      # dispatcher's, because `PlatformPrincipal.service` has to stay true and
      # because this service faces the public internet and that one does not.
      RELAY_INTERNAL_CREDENTIAL_GATEWAY: ${RELAY_INTERNAL_CREDENTIAL_GATEWAY:-rk_svc_local_development_gateway_00000}
    ports:
      - "${RELAY_GATEWAY_PORT:-4001}:4001"
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  dispatcher:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/dispatcher/Dockerfile
    environment:
      RELAY_API_URL: http://api:4000
      RELAY_NATS_URL: nats://nats:4222
      RELAY_INTERNAL_CREDENTIAL: ${RELAY_INTERNAL_CREDENTIAL:-rk_svc_local_development_credential_0000}
    # So a webhook endpoint running on the DEVELOPER'S machine is reachable from
    # inside the container. Without it, `scripts/hostile-endpoint.mjs` listens on
    # the host's loopback and the dispatcher resolves 127.0.0.1 to its own — the
    # quickstart's V6 step could not be run as written.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_healthy }
      nats: { condition: service_healthy }

  # THE ONLY SERVICE THAT READS THE BYTES (chapter 4.13).
  #
  # PROFILED, AND THE DECISION IS THE OPPOSITE OF THE SCANNER'S. Six services start on a
  # bare `docker compose up -d --wait` and this is not one of them, because the worker
  # MUTATES SHARED LANE STATE: an unprofiled worker sweeps every `pending` object in the
  # lane during every suite, deleting bytes and flipping states for fixtures other tests
  # planted. That is 056-5's *action scoped wider than its own test* at maximum scale —
  # 4.10's version stopped one container and made `gauntlet.itest.ts` answer 503 in a
  # file that never mentions media. The scanner, when it arrives, is unprofiled for the
  # complementary reason: it mutates nothing.
  #
  # THE COST IS SC-010. Only a worker inside the composed profile moves an object to
  # `ready`, so the sealed suite's media test polls `--profile services` rather than
  # asserting against a bare stack.
  media-worker:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    environment:
      RELAY_API_URL: http://api:4000
      # ITS OWN CREDENTIAL, NOT THE DISPATCHER'S. `authenticate.middleware.ts` maps
      # `RELAY_INTERNAL_CREDENTIAL` to the literal `"dispatcher"`, and `Principal.service`
      # is what every log line and request-log row reports — so sharing it would file the
      # only service that reads customer bytes under another service's name.
      RELAY_INTERNAL_CREDENTIAL_WORKER: ${RELAY_INTERNAL_CREDENTIAL_WORKER:-rk_svc_local_development_worker_000000}
      # ONE ADDRESS, NOT TWO. The api needs both because it signs URLs a client will
      # hold; the worker signs only for itself, so it has no use for the published one.
      RELAY_MINIO_INTERNAL_ENDPOINT: http://minio:9000
      RELAY_MINIO_ACCESS_KEY: relay
      RELAY_MINIO_SECRET_KEY: relay-secret
      RELAY_MINIO_BUCKET: relay-media
      # AND THE SCANNER'S ADDRESS, WHICH THE FIRST VERSION OF THIS BLOCK OMITTED —
      # 4.11's MinIO defect, reproduced one chapter later in the service whose whole
      # subject is reading bytes. `scannerConfigFromEnv` defaults to `localhost:3310`,
      # which inside this container is this container, and the worker started clean and
      # logged `scanner: "unreachable"` while every object stayed `pending` forever.
      #
      # **NOTHING WOULD HAVE FAILED.** A worker that cannot reach the scanner produces
      # no verdict, which is FR-009 working exactly as designed — so the symptom is
      # objects not becoming `ready`, and that is what an un-uploaded object looks like
      # too. The boot line is the only thing that says so, which is why it prints the
      # version rather than a boolean.
      RELAY_CLAMAV_HOST: clamav
      RELAY_CLAMAV_PORT: "3310"
    depends_on:
      api: { condition: service_healthy }
      minio: { condition: service_healthy }
      # `service_healthy`, NOT `service_started`, and this one is load-bearing: the
      # scanner answers its socket roughly twenty-five seconds before its signature
      # database is current, so a worker that started on "the container is up" would
      # scan against definitions from a fortnight ago. The health check reads the date.
      clamav: { condition: service_healthy }

volumes:
  postgres-data:
  nats-data:
  clickhouse-data:
  minio-data:
